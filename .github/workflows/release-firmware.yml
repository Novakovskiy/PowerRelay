name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32

      - name: Generate firmware artifacts
        run: |
          mkdir -p release
          cp build/PowerRelay.bin release/
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          
          # Create flash instructions
          cat > release/FLASH_INSTRUCTIONS.txt << 'EOF'
          # PowerRelay Firmware Flash Instructions
          
          ## One-liner Flash Command
          esptool.py -p PORT -b 460800 --before default-reset --after hard-reset write_flash \
            0x1000 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 PowerRelay.bin
          
          Replace PORT with your serial port (e.g., COM3 on Windows, /dev/ttyUSB0 on Linux)
          
          ## Setup
          1. Install esptool: pip install esptool
          2. Connect ESP32 via USB
          
          ## Optional: Erase and Flash Full Firmware
          esptool.py -p PORT erase_flash
          esptool.py -p PORT -b 460800 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 PowerRelay.bin
          EOF
          
          # Create checksums
          cd release && sha256sum * > SHA256SUMS && cd ..
          
          echo "=== Firmware Artifacts ==="
          ls -lh release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == true }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PowerRelay-firmware-${{ github.sha }}
          path: release/
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Artifacts building..."
          echo '```' >> $GITHUB_STEP_SUMMARY

  validate:
    name: Validate Firmware
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: PowerRelay-firmware-${{ github.sha }}

      - name: Verify binaries
        run: |
          echo "=== File Information ==="
          for file in *.bin; do
            echo "File: $file"
            file "$file"
            ls -lh "$file"
            echo ""
          done
          
          echo "=== Checksums ==="
          if [ -f SHA256SUMS ]; then
            cat SHA256SUMS
          else
            sha256sum *.bin
          fi

      - name: Check binary format
        run: |
          echo "=== Bootloader Header ==="
          hexdump -C bootloader.bin | head -5
          
          echo ""
          echo "=== App Binary Header ==="
          hexdump -C PowerRelay.bin | head -5
